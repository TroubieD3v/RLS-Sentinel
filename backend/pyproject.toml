[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rls-sentinel"
version = "1.0.0"
description = "Open-source PostgreSQL RLS auditing, cross-tenant authorization testing, policy graph analysis, and safe remediation simulation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["postgresql", "row-level-security", "rls", "supabase", "appsec", "database-security", "multitenancy"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "pglast>=7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-jsonschema",
]

[project.scripts]
rls-sentinel = "rls_sentinel.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["rls_sentinel"]

[tool.hatch.build]
# Fixtures and the built UI are copied into rls_sentinel/_bundled by scripts/build_release.py before building.
artifacts = ["rls_sentinel/_bundled/**"]

[tool.hatch.build.targets.sdist]
include = ["rls_sentinel", "tests", "pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF"]
ignore = [
  "S101",   # asserts are used in tests
  "S608",   # SQL is composed with psycopg.sql only; reviewed in code
  "B008",   # FastAPI Depends() in defaults
  "RUF012",
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"rls_sentinel/**" = ["PT"]  # pytest style rules apply to tests only
"tests/**" = ["S105", "S106", "S108", "S311", "PT018", "PT028", "PT012"]  # composite asserts keep failure messages compact

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
  "pg: requires a disposable PostgreSQL server (local binaries, Docker or SENTINEL_TEST_ADMIN_URL)",
  "slow: slow end-to-end tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

# pglast ships loosely typed AST nodes (nearly every attribute is Optional) and psycopg's `sql.Composable`
# overloads are narrower than its runtime; these modules are covered by the integration tests instead.
[[tool.mypy.overrides]]
module = ["rls_sentinel.catalog.exprs", "rls_sentinel.catalog.migrations", "rls_sentinel.diff.snapshot_diff"]
disable_error_code = ["union-attr", "index", "arg-type", "operator"]

[[tool.mypy.overrides]]
module = ["rls_sentinel.harness.executor", "rls_sentinel.harness.runner"]
disable_error_code = ["call-overload", "index"]
