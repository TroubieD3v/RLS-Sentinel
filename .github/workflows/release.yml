# Builds the release assets for a version tag, attests their provenance and stores them as a workflow artifact.
# The GitHub release itself is created by the maintainer's own account (scripts/publish_release.sh), so the
# release page shows only the maintainer and never a bot.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml','rb'))['project']['version'])")
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match package version v${version}"; exit 1; }
      - run: pip install build cyclonedx-bom
      - run: python scripts/build_release.py
      - name: SBOMs (CycloneDX) and checksums
        run: |
          pip install dist/*.whl
          cyclonedx-py environment --of JSON -o dist/sbom-python.cdx.json
          (cd frontend && npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file ../dist/sbom-ui.cdx.json)
          (cd dist && sha256sum *.whl *.tar.gz *.json > SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          retention-days: 30
