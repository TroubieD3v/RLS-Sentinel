name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17", "18"]
    env:
      PYTHONUTF8: "1"
      SENTINEL_TEST_BACKEND: docker
      SENTINEL_FIXTURE_IMAGE: postgres:${{ matrix.pg }}-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Ensure PostgreSQL server binaries (a few tests start a local cluster)
        run: ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends postgresql
      - run: pip install -e "backend[dev]"
      - run: ruff check rls_sentinel tests
        working-directory: backend
      - run: mypy rls_sentinel
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - name: Fixture benchmark against documented outcomes
        env:
          SENTINEL_FIXTURE_BACKEND: docker
        run: python scripts/benchmark.py --repeat 1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  e2e:
    name: e2e · Playwright + axe
    runs-on: ubuntu-latest
    needs: [frontend]
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      SENTINEL_FIXTURE_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Ensure PostgreSQL server binaries
        run: ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends postgresql
      - run: pip install -e backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          SENTINEL_BIN: rls-sentinel
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  compose:
    name: docker compose smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke-test.sh

  package:
    name: wheel builds and installs cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install build
      - run: python scripts/build_release.py
      - name: Install the wheel in a clean environment and check bundled assets
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/rls-sentinel version
          /tmp/wheel-venv/bin/rls-sentinel fixtures list
          /tmp/wheel-venv/bin/python -c "from rls_sentinel.config import find_ui_dir, find_fixtures_dir; assert find_ui_dir() and find_fixtures_dir()"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
